name: sangai-beta
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 200
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: sangai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-beta-only}
      POSTGRES_DB: sangai
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - beta_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangai -d sangai"]
      interval: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sangai:${POSTGRES_PASSWORD:-local-beta-only}@db:5432/sangai
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      ENABLE_PUSH: ${ENABLE_PUSH:-false}
      ENABLE_GAMES_V2: ${ENABLE_GAMES_V2:-true}
      MAX_UPLOAD_REQUESTS: ${MAX_UPLOAD_REQUESTS:-4}
      MAX_UPLOAD_REQUESTS_PER_ACCOUNT: ${MAX_UPLOAD_REQUESTS_PER_ACCOUNT:-2}
      MAX_MEDIA_PROCESSING: ${MAX_MEDIA_PROCESSING:-2}
      MAX_MEDIA_PROCESSING_PER_ACCOUNT: ${MAX_MEDIA_PROCESSING_PER_ACCOUNT:-1}
      RATE_API_PER_MINUTE: ${RATE_API_PER_MINUTE:-600}
      RATE_AUTH_PER_MINUTE: ${RATE_AUTH_PER_MINUTE:-40}
      RATE_OTP_SEND_PER_MINUTE: ${RATE_OTP_SEND_PER_MINUTE:-10}
      RATE_OTP_VERIFY_PER_MINUTE: ${RATE_OTP_VERIFY_PER_MINUTE:-30}
      RATE_UPLOAD_PER_MINUTE: ${RATE_UPLOAD_PER_MINUTE:-10}
      RATE_PROFILE_PER_MINUTE: ${RATE_PROFILE_PER_MINUTE:-30}
      RATE_MESSAGE_PER_MINUTE: ${RATE_MESSAGE_PER_MINUTE:-120}
      RATE_DISCOVERY_PER_MINUTE: ${RATE_DISCOVERY_PER_MINUTE:-120}
      RATE_GAME_INVITE_PER_MINUTE: ${RATE_GAME_INVITE_PER_MINUTE:-20}
      RATE_POST_PER_MINUTE: ${RATE_POST_PER_MINUTE:-10}
      RATE_COMMENT_PER_MINUTE: ${RATE_COMMENT_PER_MINUTE:-60}
      RATE_REACTION_PER_MINUTE: ${RATE_REACTION_PER_MINUTE:-120}
      RATE_REPORT_PER_HOUR: ${RATE_REPORT_PER_HOUR:-5}
      ADMIN_KEY: ${ADMIN_KEY:-local-beta-admin-change-me}
      PORT: 4100
      UPLOAD_DIR: /data/media
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Sangai <beta@sangai.invalid>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - beta_media:/data/media
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
volumes:
  beta_db:
  beta_media:
